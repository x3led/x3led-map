<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Блэкджек (Blackjack)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c5e2e; /* Зеленый цвет стола */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: white;
        }

        h1 { margin-bottom: 20px; }

        .game-container {
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 30px;
            border-radius: 20px;
            border: 5px solid #ffd700;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .area {
            margin: 20px 0;
            padding: 10px;
            border: 2px dashed rgba(255,255,255,0.3);
            border-radius: 10px;
            min-width: 300px;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .card {
            background-color: white;
            color: black;
            padding: 15px;
            border-radius: 8px;
            font-size: 24px;
            font-weight: bold;
            min-width: 60px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #000;
        }

        .info {
            margin-top: 10px;
            font-size: 1.2rem;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            background-color: #ffcc00;
            border: none;
            border-radius: 10px;
            margin: 10px;
            transition: transform 0.2s, background-color 0.2s;
        }

        button:hover {
            background-color: #ffdb4d;
            transform: scale(1.1);
        }

        button:disabled {
            background-color: #888;
            cursor: not-allowed;
            transform: none;
        }

        #message {
            font-size: 24px;
            margin: 20px;
            padding: 15px;
            height: 30px;
            color: #ffd700;
        }
    </style>
</head>
<body>

    <h1>Блэкджек</h1>

    <div class="game-container">
        <div class="area">
            <h3>Дилер</h3>
            <div id="dealer-cards" class="cards"></div>
            <div id="dealer-score" class="info">Очки: 0</div>
        </div>

        <div id="message">Нажмите "Новая игра", чтобы начать!</div>

        <div class="area">
            <h3>Вы</h3>
            <div id="player-cards" class="cards"></div>
            <div id="player-score" class="info">Очки: 0</div>
        </div>

        <div>
            <button id="deal-btn">Новая игра</button>
            <button id="hit-btn" disabled>Взять карту (Hit)</button>
            <button id="stand-btn" disabled>Остановиться (Stand)</button>
        </div>
    </div>

    <script>
        const dealerCardsDiv = document.getElementById('dealer-cards');
        const playerCardsDiv = document.getElementById('player-cards');
        const dealerScoreDiv = document.getElementById('dealer-score');
        const playerScoreDiv = document.getElementById('player-score');
        const messageDiv = document.getElementById('message');
        const dealBtn = document.getElementById('deal-btn');
        const hitBtn = document.getElementById('hit-btn');
        const standBtn = document.getElementById('stand-btn');

        let deck = [];
        let playerHand = [];
        let dealerHand = [];
        let gameActive = false;

        // Создание колоды
        function createDeck() {
            const suits = ['♠', '♥', '♦', '♣'];
            const values = ['6', '7', '8', '9', '10', 'J', 'Q', 'K', 'A'];
            let newDeck = [];
            for (let suit of suits) {
                for (let value of values) {
                    newDeck.push({ suit, value });
                }
            }
            return newDeck;
        }

        // Перемешивание колоды
        function shuffleDeck() {
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
        }

        // Расчет очков руки
        function calculateScore(hand) {
            let score = 0;
            let aces = 0;
            for (let card of hand) {
                if (card.value === 'A') {
                    aces++;
                    score += 11;
                } else if (['J', 'Q', 'K'].includes(card.value)) {
                    score += 10;
                } else {
                    score += parseInt(card.value);
                }
            }
            while (score > 21 && aces > 0) {
                score -= 10;
                aces--;
            }
            return score;
        }

        function updateUI() {
            dealerCardsDiv.innerHTML = '';
            dealerHand.forEach(card => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                cardEl.innerText = `${card.value}${card.suit}`;
                dealerCardsDiv.appendChild(cardEl);
            });

            playerCardsDiv.innerHTML = '';
            playerHand.forEach(card => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                cardEl.innerText = `${card.value}${card.suit}`;
                playerCardsDiv.appendChild(cardEl);
            });

            dealerScoreDiv.innerText = `Очки: ${calculateScore(dealerHand)}`;
            playerScoreDiv.innerText = `Очки: ${calculateScore(playerHand)}`;
        }

        function startNewGame() {
            deck = createDeck();
            shuffleDeck();
            playerHand = [];
            dealerHand = [];
            gameActive = true;

            // Раздача по 2 карты каждому
            playerHand.push(deck.pop());
            playerHand.push(deck.pop());
            dealerHand.push(deck.pop());
            dealerHand.push(deck.pop());

            messageDiv.innerText = "Ваш ход!";
            hitBtn.disabled = false;
            standBtn.disabled = false;
            dealBtn.disabled = true;

            updateUI();

            // Проверка на автоматическую победу при раздаче
            if (calculateScore(playerHand) >= 17) {
                playDealerTurn();
            }
        }

        function playDealerTurn() {
            // Дилер берет карты, пока у него меньше 17 очков
            while (calculateScore(dealerHand) < 17) {
                dealerHand.push(deck.pop());
            }
            updateUI();

            const pScore = calculateScore(playerHand);
            const dScore = calculateScore(dealerHand);

            if (pScore > 21) {
                messageDiv.innerText = "Вы перебрали! Дилер побеждает.";
            } else if (dScore > 21) {
                messageDiv.innerText = "Дилер перебрал! Вы победили!";
            } else if (pScore > dScore) {
                messageDiv.innerText = "Вы выиграли!";
            } else if (pScore < dScore) {
                message1.innerText = "Дилер выиграл.";
            } else {
                messageDiv.innerText = "Ничья!";
            }

            gameActive = false;
            hitBtn.disabled = true;
            standBtn.disabled = true;
            dealBtn.disabled = false;
        }

        // Обработка кнопок
        dealBtn.addEventListener('click', startNewGame);

        hitBtn.addEventListener('click', () => {
            if (!gameActive) return;
            playerHand.push(deck.pop());
            updateUI();
            
            const score = calculateScore(playerHand);
            if (score >= 17) {
                playDealerTurn();
            } else if (score > 21) {
                messageDiv.innerText = "Вы перебрали!";
                hitBtn.disabled = true;
                standBtn.disabled = true;
                dealBtn.disabled = false;
            }
        });

        standBtn.addEventListener('click', () => {
            if (!gameActive) return;
            playDealerTurn();
        });
    </script>
</body>
</html>
