<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карта — редактор</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a12;
    --panel: rgba(15,15,25,0.94);
    --panel-solid: #0f0f19;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.15);
    --text: #e8e8f0;
    --text-dim: #8888a0;
    --text-faint: #55556a;
    --accent: #8b6cff;
  }

  html, body {
    height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
    font-size: 14px;
  }

  #map {
    position: fixed; inset: 0; z-index: 1;
    background: #0a0a12;
  }

  #map.drawing .leaflet-grab {
    cursor: crosshair !important;
  }

  .panel {
    position: fixed; top: 16px; left: 16px;
    width: 340px; max-height: calc(100vh - 32px);
    overflow-y: auto;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    z-index: 1000; padding: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    transition: transform 0.3s;
  }
  .panel.hidden { transform: translateX(-380px); }
  .panel::-webkit-scrollbar { width: 5px; }
  .panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .panel-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px; padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .panel-title { font-size: 15px; font-weight: 600; }
  .panel-close {
    background: transparent; border: none; color: var(--text-faint);
    font-size: 18px; cursor: pointer; padding: 2px 8px;
    border-radius: 6px; transition: all 0.2s;
  }
  .panel-close:hover { color: var(--text); background: rgba(255,255,255,0.05); }

  .section { margin-bottom: 16px; }
  .section-title {
    font-size: 10px; text-transform: uppercase;
    letter-spacing: 1.5px; color: var(--text-faint);
    margin-bottom: 8px; font-weight: 600;
  }

  /* СТОРОНЫ */
  .side-block {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 12px; padding: 12px;
    margin-bottom: 10px; transition: all 0.2s;
  }
  .side-block.active {
    border-color: var(--accent);
    background: rgba(139,108,255,0.08);
  }
  .side-head {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 10px; cursor: pointer;
  }
  .side-dot {
    width: 14px; height: 14px; border-radius: 50%;
    flex-shrink: 0; box-shadow: 0 0 10px currentColor;
    cursor: pointer;
    position: relative;
  }
  .side-dot input[type="color"] {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border: none; padding: 0; cursor: pointer;
    opacity: 0;
  }
  .side-name { flex: 1; font-weight: 600; font-size: 13px; }
  .side-count {
    font-size: 10px; color: var(--text-faint);
    background: rgba(255,255,255,0.05);
    padding: 2px 8px; border-radius: 10px;
  }

  .side-countries {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 10px; min-height: 20px;
  }
  .country-chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 8px; background: rgba(255,255,255,0.06);
    border-radius: 6px; font-size: 11px; color: var(--text-dim);
  }
  .country-chip .remove {
    cursor: pointer; color: var(--text-faint);
    font-size: 13px; line-height: 1;
  }
  .country-chip .remove:hover { color: #ff6b6b; }

  .empty-hint {
    font-size: 11px; color: var(--text-faint); font-style: italic;
  }

  /* ПОИСК */
  .search-wrap { position: relative; }
  .search-input {
    width: 100%; padding: 8px 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 8px; color: var(--text);
    font: inherit; font-size: 12px;
    outline: none; transition: all 0.2s;
  }
  .search-input:focus {
    border-color: var(--accent);
    background: rgba(139,108,255,0.05);
  }
  .search-input::placeholder { color: var(--text-faint); }

  .search-results {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0;
    background: var(--panel-solid);
    border: 1px solid var(--border-strong);
    border-radius: 8px; max-height: 200px; overflow-y: auto;
    z-index: 100; display: none;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  }
  .search-results.show { display: block; }
  .search-results::-webkit-scrollbar { width: 4px; }
  .search-results::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .search-item {
    padding: 8px 12px; font-size: 12px;
    cursor: pointer; transition: background 0.15s;
    color: var(--text-dim);
  }
  .search-item:hover { background: rgba(255,255,255,0.06); color: var(--text); }
  .search-item.empty {
    color: var(--text-faint); font-style: italic; cursor: default;
  }

  /* КНОПКИ */
  .btn {
    width: 100%; padding: 10px 14px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    color: var(--text); border-radius: 10px;
    font: inherit; font-size: 12px; font-weight: 500;
    cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 6px; text-align: left;
  }
  .btn:hover {
    background: rgba(255,255,255,0.08);
    border-color: var(--border-strong);
  }
  .btn:active { transform: scale(0.99); }
  .btn.active {
    background: rgba(139,108,255,0.2);
    border-color: var(--accent); color: var(--text);
  }
  .btn .icon { font-size: 15px; flex-shrink: 0; }
  .btn .label { flex: 1; }
  .btn .btn-extra {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.2);
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .btn .btn-extra input[type="color"] {
    position: absolute; inset: -10px;
    width: 50px; height: 50px;
    border: none; padding: 0; cursor: pointer;
    opacity: 0;
  }
  .btn.danger { color: #ff6b6b; }
  .btn.danger:hover { background: rgba(255,80,80,0.1); border-color: rgba(255,80,80,0.3); }
  .btn.warning { color: #ffb84d; }
  .btn.warning:hover { background: rgba(255,180,80,0.1); border-color: rgba(255,180,80,0.3); }

  /* ПОЛЗУНОК ТОЛЩИНЫ */
  .thickness-row {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px;
    background: rgba(255,255,255,0.02);
    border-radius: 8px;
    margin-bottom: 6px;
  }
  .thickness-row label {
    font-size: 10px; color: var(--text-faint);
    text-transform: uppercase; letter-spacing: 1px;
    flex-shrink: 0;
  }
  .thickness-row input[type="range"] {
    flex: 1; height: 3px;
    -webkit-appearance: none;
    background: var(--border); border-radius: 3px;
    outline: none;
  }
  .thickness-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px;
    background: var(--accent); border-radius: 50%; cursor: pointer;
  }
  .thickness-row .val {
    font-size: 11px; color: var(--text); min-width: 22px;
    text-align: right; font-variant-numeric: tabular-nums;
  }

  /* СЛАЙДЕР ГОДА */
  .year-panel {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 10px 18px;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    z-index: 1000; display: flex; align-items: center; gap: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    min-width: 460px;
  }
  .year-display {
    font-size: 22px; font-weight: 700;
    font-variant-numeric: tabular-nums;
    min-width: 62px; text-align: center;
    color: var(--accent);
  }
  .year-slider {
    -webkit-appearance: none; appearance: none;
    flex: 1; height: 4px;
    background: var(--border); border-radius: 4px;
    outline: none; cursor: pointer;
  }
  .year-slider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px;
    background: var(--accent); border-radius: 50%;
    cursor: pointer; box-shadow: 0 0 12px rgba(139,108,255,0.7);
  }
  .year-slider::-moz-range-thumb {
    width: 16px; height: 16px;
    background: var(--accent); border-radius: 50%;
    cursor: pointer; border: none;
  }
  .year-btn {
    background: transparent; border: none;
    color: var(--text-dim); font-size: 18px;
    cursor: pointer; padding: 4px 8px;
    border-radius: 6px; transition: all 0.2s;
  }
  .year-btn:hover { color: var(--text); background: rgba(255,255,255,0.05); }

  /* ПЕРЕКЛЮЧАТЕЛЬ КАРТЫ */
  .map-switch {
    position: fixed; top: 16px; right: 16px;
    display: flex; gap: 4px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 4px;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    z-index: 1000;
  }
  .map-switch button {
    padding: 8px 14px; background: transparent;
    border: none; color: var(--text-dim);
    border-radius: 8px; font: inherit; font-size: 12px;
    cursor: pointer; transition: all 0.2s;
  }
  .map-switch button:hover { color: var(--text); background: rgba(255,255,255,0.05); }
  .map-switch button.active { background: var(--accent); color: #fff; }

  /* ОТКРЫТИЕ ПАНЕЛИ */
  .panel-open {
    position: fixed; top: 16px; left: 16px;
    width: 44px; height: 44px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; color: var(--text);
    font-size: 18px; cursor: pointer;
    backdrop-filter: blur(16px);
    z-index: 999; display: none;
    align-items: center; justify-content: center;
  }
  .panel-open.visible { display: flex; }
  .panel-open:hover { background: rgba(255,255,255,0.08); }

  /* СТАТИСТИКА */
  .stats { display: flex; gap: 6px; margin-top: 6px; }
  .stat {
    flex: 1; padding: 8px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 8px; text-align: center;
  }
  .stat-value {
    font-size: 16px; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .stat-label {
    font-size: 9px; color: var(--text-faint);
    text-transform: uppercase; letter-spacing: 1px;
    margin-top: 2px;
  }

  /* HINT */
  .hint {
    font-size: 11px; color: var(--text-faint);
    line-height: 1.5; padding: 8px 10px;
    background: rgba(255,255,255,0.02);
    border-radius: 8px;
    border: 1px dashed var(--border);
    margin-top: 6px;
  }

  /* ПОДСКАЗКИ КАРТЫ */
  .country-tip {
    background: rgba(15,15,25,0.95) !important;
    border: 1px solid rgba(139,108,255,0.4) !important;
    color: #e8e8f0 !important;
    font-size: 12px !important;
    padding: 4px 10px !important;
    border-radius: 6px !important;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5) !important;
    font-family: inherit !important;
  }
  .country-tip::before { display: none !important; }

  .attack-arrow { pointer-events: none; }

  @media (max-width: 720px) {
    .panel { width: calc(100vw - 32px); max-width: 340px; }
    .year-panel {
      min-width: auto; width: calc(100vw - 24px);
      left: 12px; right: 12px; transform: none;
      padding: 8px 12px; gap: 8px;
    }
    .year-display { font-size: 17px; min-width: 50px; }
    .map-switch { top: 12px; right: 12px; padding: 3px; }
    .map-switch button { padding: 6px 10px; font-size: 11px; }
  }
</style>
</head>
<body>

<div id="map"></div>

<aside class="panel" id="panel">
  <div class="panel-header">
    <div class="panel-title">Редактор карты</div>
    <button class="panel-close" id="panelClose">&times;</button>
  </div>

  <!-- СТОРОНЫ -->
  <div class="section">
    <div class="section-title">Стороны</div>

    <div class="side-block active" id="sideBlockA" data-side="A">
      <div class="side-head">
        <div class="side-dot" id="sideDotA" style="background:#e63946;color:#e63946;">
          <input type="color" id="colorA" value="#e63946" title="Цвет стороны А">
        </div>
        <div class="side-name" data-side-select="A">Сторона А</div>
        <div class="side-count" id="sideCountA">0</div>
      </div>
      <div class="side-countries" id="sideListA">
        <span class="empty-hint">Добавь страны через поиск</span>
      </div>
      <div class="search-wrap">
        <input type="text" class="search-input" id="searchA" placeholder="+ Добавить страну..." autocomplete="off">
        <div class="search-results" id="resultsA"></div>
      </div>
    </div>

    <div class="side-block" id="sideBlockB" data-side="B">
      <div class="side-head">
        <div class="side-dot" id="sideDotB" style="background:#457b9d;color:#457b9d;">
          <input type="color" id="colorB" value="#457b9d" title="Цвет стороны Б">
        </div>
        <div class="side-name" data-side-select="B">Сторона Б</div>
        <div class="side-count" id="sideCountB">0</div>
      </div>
      <div class="side-countries" id="sideListB">
        <span class="empty-hint">Добавь страны через поиск</span>
      </div>
      <div class="search-wrap">
        <input type="text" class="search-input" id="searchB" placeholder="+ Добавить страну..." autocomplete="off">
        <div class="search-results" id="resultsB"></div>
      </div>
    </div>
  </div>

  <!-- ИНСТРУМЕНТЫ -->
  <div class="section">
    <div class="section-title">Инструменты</div>

    <button class="btn" id="btnAnnex">
      <span class="icon">&#127988;</span>
      <span class="label">Аннексия страны</span>
    </button>

    <button class="btn" id="btnLasso">
      <span class="icon">&#9998;</span>
      <span class="label">Обвести регион</span>
    </button>

    <button class="btn" id="btnPencil">
      <span class="icon">&#128396;</span>
      <span class="label">Карандаш</span>
      <div class="btn-extra" id="pencilColorWrap" style="background:#8b6cff;">
        <input type="color" id="pencilColor" value="#8b6cff" title="Цвет карандаша">
      </div>
    </button>
    <div class="thickness-row">
      <label>Толщина</label>
      <input type="range" id="pencilThickness" min="1" max="12" value="3">
      <span class="val" id="pencilThicknessVal">3</span>
    </div>

    <button class="btn" id="btnAttack">
      <span class="icon">&#9876;</span>
      <span class="label">Линия атаки (2 клика)</span>
      <div class="btn-extra" id="attackColorWrap" style="background:#ffaa33;">
        <input type="color" id="attackColor" value="#ffaa33" title="Цвет атаки">
      </div>
    </button>
    <div class="thickness-row">
      <label>Толщина</label>
      <input type="range" id="attackThickness" min="1" max="10" value="3">
      <span class="val" id="attackThicknessVal">3</span>
    </div>

    <button class="btn" id="btnAdvance">
      <span class="icon">&#10148;</span>
      <span class="label">Линия продвижения</span>
    </button>
  </div>

  <!-- АКТИВНАЯ СТОРОНА -->
  <div class="section">
    <div class="section-title">Активная сторона</div>
    <button class="btn" id="activeSideBtn">
      <span class="side-dot" id="activeSideDot" style="width:12px;height:12px;border-radius:50%;box-shadow:0 0 8px currentColor;background:#e63946;color:#e63946;"></span>
      <span class="label" id="activeSideLabel">Сторона А</span>
    </button>
  </div>

  <!-- ДЕЙСТВИЯ -->
  <div class="section">
    <div class="section-title">Действия</div>
    <button class="btn warning" id="btnUndo">
      <span class="icon">&#8630;</span>
      <span class="label">Отменить последнее</span>
    </button>
    <button class="btn danger" id="btnClear">
      <span class="icon">&#128465;</span>
      <span class="label">Удалить всё (этот год)</span>
    </button>
  </div>

  <!-- ЭКСПОРТ -->
  <div class="section">
    <div class="section-title">Файл карты</div>
    <button class="btn" id="btnExport">
      <span class="icon">&#128190;</span>
      <span class="label">Сохранить в файл</span>
    </button>
    <button class="btn" id="btnImport">
      <span class="icon">&#128194;</span>
      <span class="label">Загрузить из файла</span>
    </button>
    <input type="file" id="importFile" accept=".json,application/json" style="display:none">
  </div>

  <!-- СТАТИСТИКА -->
  <div class="section">
    <div class="section-title">Статистика · <span id="statsYear">2026</span></div>
    <div class="stats">
      <div class="stat">
        <div class="stat-value" id="statRegions">0</div>
        <div class="stat-label">регионов</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="statLines">0</div>
        <div class="stat-label">линий</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="statAttacks">0</div>
        <div class="stat-label">атак</div>
      </div>
    </div>
    <div class="hint">
      ПКМ — двигать карту.<br>
      ЛКМ — рисовать в режиме инструмента.<br>
      ESC — отменить режим.
    </div>
  </div>
</aside>

<button class="panel-open" id="panelOpen">&#9776;</button>

<div class="map-switch">
  <button class="active" data-map="satellite">Спутник</button>
  <button data-map="dark">Тёмная</button>
  <button data-map="light">Светлая</button>
</div>

<div class="year-panel">
  <button class="year-btn" id="yearPrev">&#8249;</button>
  <div class="year-display" id="yearDisplay">2026</div>
  <input type="range" class="year-slider" id="yearSlider" min="1950" max="2026" value="2026" step="1">
  <button class="year-btn" id="yearNext">&#8250;</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

</body>
<script>
  // ============================================================
  // ЧАСТЬ 2 — карта, страны, города, ПКМ-драг
  // ============================================================

  // ---------- КАРТА ----------
  const map = L.map('map', {
    center: [30, 30],
    zoom: 3,
    minZoom: 2,
    maxZoom: 18,
    worldCopyJump: true,
    zoomControl: false,
    dragging: true,
    tap: false,
    contextmenu: false
  });

  L.control.zoom({ position: 'bottomright' }).addTo(map);
  map.getContainer().addEventListener('contextmenu', e => e.preventDefault());

  // ---------- ПКМ = ПАНОРАМИРОВАНИЕ ----------
  (function rightClickPan() {
    const container = map.getContainer();
    let isPanning = false;
    let startX = 0, startY = 0;
    let startCenter = null;

    container.addEventListener('mousedown', e => {
      if (e.button !== 2) return;
      e.preventDefault();
      e.stopPropagation();
      isPanning = true;
      startX = e.clientX;
      startY = e.clientY;
      startCenter = map.getCenter();
      container.style.cursor = 'grabbing';
    }, true);

    document.addEventListener('mousemove', e => {
      if (!isPanning) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      const startPoint = map.project(startCenter, map.getZoom());
      const newPoint = L.point(startPoint.x - dx, startPoint.y - dy);
      const newCenter = map.unproject(newPoint, map.getZoom());
      map.setView(newCenter, map.getZoom(), { animate: false });
    });

    document.addEventListener('mouseup', e => {
      if (e.button !== 2) return;
      isPanning = false;
      container.style.cursor = '';
    });
  })();

  // ---------- СЛОИ КАРТЫ ----------
  const layers = {
    satellite: L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      { maxZoom: 18, attribution: '&copy; Esri' }
    ),
    dark: L.tileLayer(
      'https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png',
      { maxZoom: 19, subdomains: 'abcd', attribution: '&copy; OSM, CARTO' }
    ),
    light: L.tileLayer(
      'https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',
      { maxZoom: 19, subdomains: 'abcd', attribution: '&copy; OSM, CARTO' }
    )
  };

  const labelLayers = {
    satellite: null,
    dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png', {
      maxZoom: 19, subdomains: 'abcd', pane: 'shadowPane', opacity: 0.85
    }),
    light: L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', {
      maxZoom: 19, subdomains: 'abcd', pane: 'shadowPane', opacity: 0.85
    })
  };

  let currentLayer = layers.satellite;
  let currentLabels = null;
  currentLayer.addTo(map);

  document.querySelectorAll('.map-switch button').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.map;
      document.querySelectorAll('.map-switch button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      map.removeLayer(currentLayer);
      if (currentLabels) map.removeLayer(currentLabels);
      currentLayer = layers[key];
      currentLayer.addTo(map);
      if (labelLayers[key]) {
        currentLabels = labelLayers[key];
        currentLabels.addTo(map);
      } else {
        currentLabels = null;
      }
    });
  });

  // ---------- СТРАНЫ (Natural Earth, русские названия) ----------
  const countriesLayer = L.geoJSON(null, {
    style: () => ({
      color: 'rgba(160,140,255,0.7)',
      weight: 1.2,
      fillColor: 'rgba(139,108,255,0.05)',
      fillOpacity: 0.4,
      opacity: 0.85
    }),
    onEachFeature: (feature, layer) => {
      const p = feature.properties;
      const nameRu = p.NAME_RU || p.name_ru || p.NAME || 'Неизвестно';
      const nameEn = p.NAME || '';
      feature.properties.__nameRu = nameRu;
      feature.properties.__nameEn = nameEn;
      layer.__baseStyle = {
        color: 'rgba(160,140,255,0.7)',
        weight: 1.2,
        fillColor: 'rgba(139,108,255,0.05)',
        fillOpacity: 0.4,
        opacity: 0.85
      };
      layer.bindTooltip(nameRu, {
        sticky: true, direction: 'top', offset: [0, -5],
        className: 'country-tip'
      });
      layer.on('mouseover', () => {
        if (!layer.__customStyle) {
          layer.setStyle({
            color: 'rgba(160,140,255,1)',
            fillColor: 'rgba(139,108,255,0.15)',
            weight: 1.8
          });
        }
      });
      layer.on('mouseout', () => {
        if (layer.__customStyle) {
          layer.setStyle(layer.__customStyle);
        } else {
          layer.setStyle(layer.__baseStyle);
        }
      });
    }
  }).addTo(map);

  const COUNTRIES_URL = 'https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_0_countries.geojson';

  fetch(COUNTRIES_URL)
    .then(r => r.json())
    .then(data => {
      countriesLayer.addData(data);
      console.log('Стран загружено:', data.features.length);
      window.__countriesData = data.features;
      window.dispatchEvent(new CustomEvent('countries:loaded'));
    })
    .catch(err => console.error('Ошибка загрузки стран:', err));

  // ---------- ГОРОДА (русские названия) ----------
  const bigCities = [
    { name: 'Москва', coords: [55.7558, 37.6173], minZoom: 4 },
    { name: 'Минск', coords: [53.9006, 27.5590], minZoom: 5 },
    { name: 'Киев', coords: [50.4501, 30.5234], minZoom: 5 },
    { name: 'Санкт-Петербург', coords: [59.9311, 30.3609], minZoom: 5 },
    { name: 'Варшава', coords: [52.2297, 21.0122], minZoom: 5 },
    { name: 'Берлин', coords: [52.5200, 13.4050], minZoom: 5 },
    { name: 'Париж', coords: [48.8566, 2.3522], minZoom: 5 },
    { name: 'Лондон', coords: [51.5074, -0.1278], minZoom: 5 },
    { name: 'Рим', coords: [41.9028, 12.4964], minZoom: 5 },
    { name: 'Мадрид', coords: [40.4168, -3.7038], minZoom: 5 },
    { name: 'Прага', coords: [50.0755, 14.4378], minZoom: 5 },
    { name: 'Вена', coords: [48.2082, 16.3738], minZoom: 5 },
    { name: 'Будапешт', coords: [47.4979, 19.0402], minZoom: 5 },
    { name: 'Бухарест', coords: [44.4268, 26.1025], minZoom: 5 },
    { name: 'София', coords: [42.6977, 23.3219], minZoom: 5 },
    { name: 'Афины', coords: [37.9838, 23.7275], minZoom: 5 },
    { name: 'Анкара', coords: [39.9334, 32.8597], minZoom: 5 },
    { name: 'Стамбул', coords: [41.0082, 28.9784], minZoom: 5 },
    { name: 'Токио', coords: [35.6762, 139.6503], minZoom: 4 },
    { name: 'Пекин', coords: [39.9042, 116.4074], minZoom: 4 },
    { name: 'Шанхай', coords: [31.2304, 121.4737], minZoom: 5 },
    { name: 'Сеул', coords: [37.5665, 126.9780], minZoom: 5 },
    { name: 'Дели', coords: [28.6139, 77.2090], minZoom: 4 },
    { name: 'Вашингтон', coords: [38.9072, -77.0369], minZoom: 4 },
    { name: 'Нью-Йорк', coords: [40.7128, -74.0060], minZoom: 4 },
    { name: 'Лос-Анджелес', coords: [34.0522, -118.2437], minZoom: 5 },
    { name: 'Оттава', coords: [45.4215, -75.6972], minZoom: 5 },
    { name: 'Мехико', coords: [19.4326, -99.1332], minZoom: 5 },
    { name: 'Бразилиа', coords: [-15.8267, -47.9218], minZoom: 5 },
    { name: 'Буэнос-Айрес', coords: [-34.6037, -58.3816], minZoom: 5 },
    { name: 'Каир', coords: [30.0444, 31.2357], minZoom: 5 },
    { name: 'Кейптаун', coords: [-33.9249, 18.4241], minZoom: 5 },
    { name: 'Лагос', coords: [6.5244, 3.3792], minZoom: 5 },
    { name: 'Сидней', coords: [-33.8688, 151.2093], minZoom: 4 },
    { name: 'Канберра', coords: [-35.2809, 149.1300], minZoom: 5 }
  ];

  const citiesLayer = L.layerGroup().addTo(map);

  function renderCities() {
    citiesLayer.clearLayers();
    const z = map.getZoom();
    bigCities.forEach(city => {
      if (z < city.minZoom) return;
      const icon = L.divIcon({
        className: 'city-label',
        html: '<div style="font-family:-apple-system,\'Segoe UI\',Roboto,sans-serif;font-size:13px;font-weight:600;color:#fff;text-shadow:0 0 3px #000,0 0 6px #000,0 1px 2px #000;white-space:nowrap;pointer-events:none;transform:translate(-50%,-50%);">' + city.name + '</div>',
        iconSize: [0, 0], iconAnchor: [0, 0]
      });
      L.marker(city.coords, { icon, interactive: false }).addTo(citiesLayer);
    });
  }

  map.on('zoomend', renderCities);
  renderCities();

  // ---------- ПАНЕЛЬ (сворачивание) ----------
  const panel = document.getElementById('panel');
  const panelOpen = document.getElementById('panelOpen');
  const panelClose = document.getElementById('panelClose');

  panelClose.addEventListener('click', () => {
    panel.classList.add('hidden');
    panelOpen.classList.add('visible');
  });
  panelOpen.addEventListener('click', () => {
    panel.classList.remove('hidden');
    panelOpen.classList.remove('visible');
  });

  // ---------- СЛАЙДЕР ГОДА ----------
  const yearSlider = document.getElementById('yearSlider');
  const yearDisplay = document.getElementById('yearDisplay');
  const yearPrev = document.getElementById('yearPrev');
  const yearNext = document.getElementById('yearNext');
  const statsYear = document.getElementById('statsYear');
  let currentYear = 2026;

  yearSlider.addEventListener('input', () => {
    currentYear = parseInt(yearSlider.value, 10);
    yearDisplay.textContent = currentYear;
    statsYear.textContent = currentYear;
    window.dispatchEvent(new CustomEvent('year:changed', { detail: currentYear }));
  });

  yearPrev.addEventListener('click', () => {
    yearSlider.value = Math.max(1950, parseInt(yearSlider.value, 10) - 1);
    yearSlider.dispatchEvent(new Event('input'));
  });
  yearNext.addEventListener('click', () => {
    yearSlider.value = Math.min(2026, parseInt(yearSlider.value, 10) + 1);
    yearSlider.dispatchEvent(new Event('input'));
  });

  // ---------- ЭКСПОРТ В ГЛОБАЛ ----------
  window.__map = map;
  window.__countriesLayer = countriesLayer;
  window.__currentYear = () => currentYear;
  window.__yearSlider = yearSlider;
</script>

</body>
<script>
  // ============================================================
  // ЧАСТЬ 3 — стороны, поиск, аннексия, цвета
  // ============================================================

  const COLORS = { A: '#e63946', B: '#457b9d' };

  // ---------- СОСТОЯНИЕ ----------
  const sides = {
    A: { name: 'Сторона А', countries: [], color: COLORS.A },
    B: { name: 'Сторона Б', countries: [], color: COLORS.B }
  };
  let activeSide = 'A';

  // ---------- ЦВЕТА ИНСТРУМЕНТОВ ----------
  let pencilColor = '#8b6cff';
  let pencilThickness = 3;
  let attackColor = '#ffaa33';
  let attackThickness = 3;

  // ---------- ХРАНИЛИЩЕ ----------
  const STORAGE_KEY = 'x3led-map-new';

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return {};
  }

  function saveState() {
    const state = {
      sides, activeSide,
      pencilColor, pencilThickness,
      attackColor, attackThickness,
      years: window.__yearsData || {}
    };
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  const saved = loadState();
  window.__yearsData = saved.years || {};

  if (saved.sides) {
    sides.A.countries = saved.sides.A?.countries || [];
    sides.B.countries = saved.sides.B?.countries || [];
    if (saved.sides.A?.color) sides.A.color = saved.sides.A.color;
    if (saved.sides.B?.color) sides.B.color = saved.sides.B.color;
    COLORS.A = sides.A.color;
    COLORS.B = sides.B.color;
  }
  if (saved.activeSide) activeSide = saved.activeSide;
  if (saved.pencilColor) pencilColor = saved.pencilColor;
  if (saved.pencilThickness) pencilThickness = saved.pencilThickness;
  if (saved.attackColor) attackColor = saved.attackColor;
  if (saved.attackThickness) attackThickness = saved.attackThickness;

  function ensureYear(year) {
    if (!window.__yearsData[year]) {
      window.__yearsData[year] = { regions: [], lines: [], attacks: [] };
    }
    const y = window.__yearsData[year];
    if (!y.regions) y.regions = [];
    if (!y.lines) y.lines = [];
    if (!y.attacks) y.attacks = [];
    return y;
  }

  // ---------- СЛОИ ----------
  const regionsLayer = L.featureGroup().addTo(window.__map);
  const linesLayer = L.featureGroup().addTo(window.__map);
  const attacksLayer = L.featureGroup().addTo(window.__map);

  // ---------- ПРИМЕНЕНИЕ ЦВЕТОВ ИЗ UI ----------
  const colorAInput = document.getElementById('colorA');
  const colorBInput = document.getElementById('colorB');
  const pencilColorInput = document.getElementById('pencilColor');
  const pencilColorWrap = document.getElementById('pencilColorWrap');
  const pencilThicknessInput = document.getElementById('pencilThickness');
  const pencilThicknessVal = document.getElementById('pencilThicknessVal');
  const attackColorInput = document.getElementById('attackColor');
  const attackColorWrap = document.getElementById('attackColorWrap');
  const attackThicknessInput = document.getElementById('attackThickness');
  const attackThicknessVal = document.getElementById('attackThicknessVal');

  // Применить сохранённые цвета в UI
  colorAInput.value = sides.A.color;
  colorBInput.value = sides.B.color;
  document.getElementById('sideDotA').style.background = sides.A.color;
  document.getElementById('sideDotA').style.color = sides.A.color;
  document.getElementById('sideDotB').style.background = sides.B.color;
  document.getElementById('sideDotB').style.color = sides.B.color;

  pencilColorInput.value = pencilColor;
  pencilColorWrap.style.background = pencilColor;
  pencilThicknessInput.value = pencilThickness;
  pencilThicknessVal.textContent = pencilThickness;

  attackColorInput.value = attackColor;
  attackColorWrap.style.background = attackColor;
  attackThicknessInput.value = attackThickness;
  attackThicknessVal.textContent = attackThickness;

  // ---------- ОБНОВЛЕНИЕ UI СТОРОН ----------
  function updateSideUI() {
    document.getElementById('sideCountA').textContent = sides.A.countries.length;
    document.getElementById('sideCountB').textContent = sides.B.countries.length;

    const listA = document.getElementById('sideListA');
    listA.innerHTML = sides.A.countries.length === 0
      ? '<span class="empty-hint">Добавь страны через поиск</span>'
      : sides.A.countries.map(c =>
          '<span class="country-chip">' + c + '<span class="remove" data-remove-side="A" data-country="' + c + '">×</span></span>'
        ).join('');

    const listB = document.getElementById('sideListB');
    listB.innerHTML = sides.B.countries.length === 0
      ? '<span class="empty-hint">Добавь страны через поиск</span>'
      : sides.B.countries.map(c =>
          '<span class="country-chip">' + c + '<span class="remove" data-remove-side="B" data-country="' + c + '">×</span></span>'
        ).join('');

    document.querySelectorAll('[data-remove-side]').forEach(el => {
      el.addEventListener('click', e => {
        e.stopPropagation();
        const side = el.dataset.removeSide;
        const country = el.dataset.country;
        sides[side].countries = sides[side].countries.filter(c => c !== country);
        updateSideUI();
        repaintCountries();
        saveState();
      });
    });

    document.getElementById('activeSideLabel').textContent = sides[activeSide].name;
    const dot = document.getElementById('activeSideDot');
    dot.style.background = sides[activeSide].color;
    dot.style.color = sides[activeSide].color;

    document.getElementById('sideBlockA').classList.toggle('active', activeSide === 'A');
    document.getElementById('sideBlockB').classList.toggle('active', activeSide === 'B');
  }

  // ---------- ВЫБОР СТОРОНЫ ----------
  document.querySelectorAll('[data-side-select]').forEach(el => {
    el.addEventListener('click', () => {
      activeSide = el.dataset.sideSelect;
      updateSideUI();
      saveState();
    });
  });

  document.getElementById('activeSideBtn').addEventListener('click', () => {
    activeSide = activeSide === 'A' ? 'B' : 'A';
    updateSideUI();
    saveState();
  });

  // ---------- ИЗМЕНЕНИЕ ЦВЕТОВ ----------
  colorAInput.addEventListener('input', e => {
    sides.A.color = e.target.value;
    COLORS.A = e.target.value;
    document.getElementById('sideDotA').style.background = e.target.value;
    document.getElementById('sideDotA').style.color = e.target.value;
    repaintCountries();
    renderYear(window.__currentYear());
    saveState();
  });

  colorBInput.addEventListener('input', e => {
    sides.B.color = e.target.value;
    COLORS.B = e.target.value;
    document.getElementById('sideDotB').style.background = e.target.value;
    document.getElementById('sideDotB').style.color = e.target.value;
    repaintCountries();
    renderYear(window.__currentYear());
    saveState();
  });

  pencilColorInput.addEventListener('input', e => {
    pencilColor = e.target.value;
    pencilColorWrap.style.background = e.target.value;
    saveState();
  });

  pencilThicknessInput.addEventListener('input', e => {
    pencilThickness = parseInt(e.target.value, 10);
    pencilThicknessVal.textContent = pencilThickness;
    saveState();
  });

  attackColorInput.addEventListener('input', e => {
    attackColor = e.target.value;
    attackColorWrap.style.background = e.target.value;
    saveState();
  });

  attackThicknessInput.addEventListener('input', e => {
    attackThickness = parseInt(e.target.value, 10);
    attackThicknessVal.textContent = attackThickness;
    saveState();
  });

  // ---------- ИНДЕКС СТРАН ----------
  let allCountriesNames = [];

  function buildCountryIndex() {
    if (!window.__countriesLayer) return;
    allCountriesNames = [];
    window.__countriesLayer.eachLayer(layer => {
      const name = layer.feature.properties.__nameRu;
      if (name) allCountriesNames.push(name);
    });
    allCountriesNames.sort((a, b) => a.localeCompare(b, 'ru'));
    console.log('Индекс стран:', allCountriesNames.length);
  }

  // ---------- ПОИСК ----------
  function setupSearch(sideKey) {
    const input = document.getElementById('search' + sideKey);
    const results = document.getElementById('results' + sideKey);

    input.addEventListener('input', () => {
      const q = input.value.trim().toLowerCase();
      if (!q) { results.classList.remove('show'); return; }

      const matches = allCountriesNames
        .filter(n => n.toLowerCase().includes(q))
        .filter(n => !sides[sideKey].countries.includes(n))
        .slice(0, 30);

      results.innerHTML = matches.length === 0
        ? '<div class="search-item empty">Не найдено</div>'
        : matches.map(n => '<div class="search-item" data-country="' + n + '">' + n + '</div>').join('');

      results.classList.add('show');

      results.querySelectorAll('.search-item:not(.empty)').forEach(item => {
        item.addEventListener('click', () => {
          const country = item.dataset.country;
          if (!sides[sideKey].countries.includes(country)) {
            sides[sideKey].countries.push(country);
          }
          input.value = '';
          results.classList.remove('show');
          updateSideUI();
          repaintCountries();
          saveState();
        });
      });
    });

    input.addEventListener('blur', () => {
      setTimeout(() => results.classList.remove('show'), 200);
    });
  }

  setupSearch('A');
  setupSearch('B');

  // ---------- ПЕРЕКРАСКА СТРАН ----------
  function repaintCountries() {
    if (!window.__countriesLayer) return;
    window.__countriesLayer.eachLayer(layer => {
      const name = layer.feature.properties.__nameRu;

      if (sides.A.countries.includes(name)) {
        const style = { color: sides.A.color, fillColor: sides.A.color, fillOpacity: 0.4, weight: 2, opacity: 1 };
        layer.setStyle(style);
        layer.__customStyle = style;
      } else if (sides.B.countries.includes(name)) {
        const style = { color: sides.B.color, fillColor: sides.B.color, fillOpacity: 0.4, weight: 2, opacity: 1 };
        layer.setStyle(style);
        layer.__customStyle = style;
      } else {
        layer.setStyle(layer.__baseStyle);
        layer.__customStyle = null;
      }
    });
  }

  // ---------- АННЕКСИЯ ----------
  let currentMode = null;

  const btnAnnex = document.getElementById('btnAnnex');
  const btnLasso = document.getElementById('btnLasso');
  const btnPencil = document.getElementById('btnPencil');
  const btnAttack = document.getElementById('btnAttack');
  const btnAdvance = document.getElementById('btnAdvance');
  const mapContainer = document.getElementById('map');

  function setMode(mode) {
    [btnAnnex, btnLasso, btnPencil, btnAttack, btnAdvance].forEach(b => {
      if (b) b.classList.remove('active');
    });
    mapContainer.classList.remove('drawing');

    if (currentMode === mode) {
      currentMode = null;
      window.__map.dragging.enable();
      return;
    }

    currentMode = mode;

    if (mode === 'annex') {
      btnAnnex.classList.add('active');
    } else if (mode === 'lasso') {
      btnLasso.classList.add('active');
      mapContainer.classList.add('drawing');
      window.__map.dragging.disable();
    } else if (mode === 'pencil') {
      btnPencil.classList.add('active');
      mapContainer.classList.add('drawing');
      window.__map.dragging.disable();
    } else if (mode === 'attack') {
      btnAttack.classList.add('active');
    } else if (mode === 'advance') {
      btnAdvance.classList.add('active');
      mapContainer.classList.add('drawing');
      window.__map.dragging.disable();
    }
  }

  btnAnnex.addEventListener('click', () => setMode('annex'));
  btnLasso.addEventListener('click', () => setMode('lasso'));
  btnPencil.addEventListener('click', () => setMode('pencil'));
  btnAttack.addEventListener('click', () => setMode('attack'));
  btnAdvance.addEventListener('click', () => setMode('advance'));

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      setMode(null);
      currentMode = null;
      window.__map.dragging.enable();
      mapContainer.classList.remove('drawing');
    }
  });

  function attachAnnexHandler() {
    if (!window.__countriesLayer) return;
    window.__countriesLayer.eachLayer(layer => {
      layer.off('click');
      layer.on('click', e => {
        if (currentMode !== 'annex') return;
        L.DomEvent.stopPropagation(e);

        const name = layer.feature.properties.__nameRu;
        if (!name) return;

        const other = activeSide === 'A' ? 'B' : 'A';
        sides[other].countries = sides[other].countries.filter(c => c !== name);

        if (!sides[activeSide].countries.includes(name)) {
          sides[activeSide].countries.push(name);
        }

        updateSideUI();
        repaintCountries();
        saveState();
      });
    });
  }

  window.addEventListener('countries:loaded', () => {
    buildCountryIndex();
    repaintCountries();
    attachAnnexHandler();
  });

  if (window.__countriesData) {
    buildCountryIndex();
    repaintCountries();
    attachAnnexHandler();
  }

  // ---------- ОБНОВЛЕНИЕ СТАТИСТИКИ ----------
  function updateStats() {
    const y = ensureYear(window.__currentYear());
    document.getElementById('statRegions').textContent = y.regions.length;
    document.getElementById('statLines').textContent = y.lines.length;
    document.getElementById('statAttacks').textContent = y.attacks.length;
  }

  // ---------- ОТРИСОВКА ГОДА ----------
  function renderYear(year) {
    regionsLayer.clearLayers();
    linesLayer.clearLayers();
    attacksLayer.clearLayers();

    const y = ensureYear(year);

    // Регионы (лассо)
    y.regions.forEach((r, idx) => {
      const poly = L.geoJSON(r.geometry, {
        style: {
          color: r.color || COLORS[r.side],
          weight: 3,
          fillColor: r.color || COLORS[r.side],
          fillOpacity: 0.4
        }
      }).addTo(regionsLayer);

      poly.eachLayer(l => {
        l.bindPopup('<div style="font-family:inherit;font-size:13px;color:#333;"><b>Регион</b><br><button onclick="window.__delRegion(' + idx + ')" style="margin-top:6px;padding:4px 10px;cursor:pointer;background:#e63946;color:#fff;border:none;border-radius:4px;">Удалить</button></div>');
      });
    });

    // Линии карандаша
    y.lines.forEach((line, idx) => {
      L.polyline(line.coords, {
        color: line.color || pencilColor,
        weight: line.thickness || pencilThickness,
        opacity: 0.95,
        lineCap: 'round',
        lineJoin: 'round'
      }).addTo(linesLayer).bindPopup(
        '<div style="font-family:inherit;font-size:13px;color:#333;"><b>Линия</b><br><button onclick="window.__delLine(' + idx + ')" style="margin-top:6px;padding:4px 10px;cursor:pointer;background:#e63946;color:#fff;border:none;border-radius:4px;">Удалить</button></div>'
      );
    });

    // Атаки
    y.attacks.forEach((a, idx) => {
      const c = a.color || attackColor;
      L.polyline(a.coords, {
        color: c,
        weight: a.thickness || attackThickness,
        dashArray: '10 6',
        opacity: 1
      }).addTo(attacksLayer).bindPopup(
        '<div style="font-family:inherit;font-size:13px;color:#333;"><b>Линия атаки</b><br><button onclick="window.__delAttack(' + idx + ')" style="margin-top:6px;padding:4px 10px;cursor:pointer;background:#e63946;color:#fff;border:none;border-radius:4px;">Удалить</button></div>'
      );

      // Стрелка на конце
      if (a.coords.length >= 2) {
        const last = a.coords[a.coords.length - 1];
        const prev = a.coords[a.coords.length - 2];
        const angle = Math.atan2(last[0] - prev[0], last[1] - prev[1]) * (180 / Math.PI);
        const arrow = L.divIcon({
          className: 'attack-arrow',
          html: '<div style="transform: rotate(' + (-angle + 90) + 'deg);color:' + c + ';font-size:26px;font-weight:bold;text-shadow:0 0 10px ' + c + ', 0 0 4px #000;line-height:1;margin-top:-13px;margin-left:-13px;">&#10148;</div>',
          iconSize: [26, 26], iconAnchor: [13, 13]
        });
        L.marker([last[0], last[1]], { icon: arrow, interactive: false }).addTo(attacksLayer);
      }
    });

    updateStats();
  }

  // ---------- УДАЛЕНИЕ ----------
  window.__delRegion = function(idx) {
    const y = ensureYear(window.__currentYear());
    y.regions.splice(idx, 1);
    saveState();
    renderYear(window.__currentYear());
    window.__map.closePopup();
  };
  window.__delLine = function(idx) {
    const y = ensureYear(window.__currentYear());
    y.lines.splice(idx, 1);
    saveState();
    renderYear(window.__currentYear());
    window.__map.closePopup();
  };
  window.__delAttack = function(idx) {
    const y = ensureYear(window.__currentYear());
    y.attacks.splice(idx, 1);
    saveState();
    renderYear(window.__currentYear());
    window.__map.closePopup();
  };

  // ---------- ОЧИСТКА ВСЕГО ----------
  document.getElementById('btnClear').addEventListener('click', () => {
    if (!confirm('Удалить всё за ' + window.__currentYear() + ' год?')) return;
    window.__yearsData[window.__currentYear()] = { regions: [], lines: [], attacks: [] };
    saveState();
    renderYear(window.__currentYear());
  });

  // ---------- ОТМЕНИТЬ ПОСЛЕДНЕЕ ----------
  document.getElementById('btnUndo').addEventListener('click', () => {
    const y = ensureYear(window.__currentYear());
    // находим последнее действие по времени — не храним время, поэтому просто удаляем последнее из трёх массивов,
    // приоритет: attacks → lines → regions (сначала самое новое сверху)
    if (y.attacks.length > 0) {
      y.attacks.pop();
    } else if (y.lines.length > 0) {
      y.lines.pop();
    } else if (y.regions.length > 0) {
      y.regions.pop();
    } else {
      alert('Нечего отменять');
      return;
    }
    saveState();
    renderYear(window.__currentYear());
  });

  // ---------- СМЕНА ГОДА ----------
  window.addEventListener('year:changed', () => {
    renderYear(window.__currentYear());
  });

  // ---------- ИНИЦИАЛИЗАЦИЯ ----------
  updateSideUI();
  renderYear(window.__currentYear());

  // ---------- ЭКСПОРТ В ГЛОБАЛ ----------
  window.__sides = sides;
  window.__activeSide = () => activeSide;
  window.__COLORS = COLORS;
  window.__pencilColor = () => pencilColor;
  window.__pencilThickness = () => pencilThickness;
  window.__attackColor = () => attackColor;
  window.__attackThickness = () => attackThickness;
  window.__saveState = saveState;
  window.__renderYear = renderYear;
  window.__setMode = setMode;
  window.__currentMode = () => currentMode;
  window.__regionsLayer = regionsLayer;
  window.__linesLayer = linesLayer;
  window.__attacksLayer = attacksLayer;
  window.__ensureYear = ensureYear;
  window.__updateStats = updateStats;
</script>

</body>
<script>
  // ============================================================
  // ЧАСТЬ 4 — лассо, карандаш, линия атаки, линия продвижения
  // ============================================================

  const map = window.__map;
  const mapContainer = document.getElementById('map');
  const regionsLayer = window.__regionsLayer;
  const linesLayer = window.__linesLayer;
  const attacksLayer = window.__attacksLayer;

  // ============================================================
  // ЛАССО — обводка региона с авто-панорамированием у краёв
  // ============================================================
  let lassoPoints = [];
  let lassoLine = null;
  let lassoDrawing = false;
  let autoPanInterval = null;

  function startAutoPan(clientX, clientY) {
    stopAutoPan();
    autoPanInterval = setInterval(() => {
      const rect = mapContainer.getBoundingClientRect();
      const margin = 60;
      let dx = 0, dy = 0;

      if (clientX < rect.left + margin) dx = -10;
      if (clientX > rect.right - margin) dx = 10;
      if (clientY < rect.top + margin) dy = -10;
      if (clientY > rect.bottom - margin) dy = 10;

      if (dx !== 0 || dy !== 0) {
        map.panBy([dx, dy], { animate: false });
      }
    }, 30);
  }

  function stopAutoPan() {
    if (autoPanInterval) {
      clearInterval(autoPanInterval);
      autoPanInterval = null;
    }
  }

  map.on('mousedown', e => {
    if (window.__currentMode() !== 'lasso') return;
    if (e.originalEvent && e.originalEvent.button !== 0) return;

    lassoDrawing = true;
    lassoPoints = [e.latlng];

    lassoLine = L.polyline(lassoPoints, {
      color: window.__COLORS[window.__activeSide()],
      weight: 3,
      opacity: 1,
      dashArray: '6 4',
      lineCap: 'round'
    }).addTo(map);
  });

  map.on('mousemove', e => {
    if (!lassoDrawing) return;
    lassoPoints.push(e.latlng);
    lassoLine.setLatLngs(lassoPoints);

    // авто-пан у края
    if (e.originalEvent) {
      startAutoPan(e.originalEvent.clientX, e.originalEvent.clientY);
    }
  });

  map.on('mouseup', e => {
    if (!lassoDrawing) return;
    lassoDrawing = false;
    stopAutoPan();

    if (lassoLine) {
      map.removeLayer(lassoLine);
      lassoLine = null;
    }

    if (lassoPoints.length < 3) {
      lassoPoints = [];
      return;
    }

    // ЗАМЫКАЕМ точно от последней точки к первой
    const closed = lassoPoints.slice();
    closed.push(closed[0]);

    const side = window.__activeSide();
    const color = window.__COLORS[side];

    // Полигон с заливкой
    const polygon = L.polygon(closed, {
      color: color,
      weight: 2.5,
      fillColor: color,
      fillOpacity: 0.4,
      opacity: 1,
      lineJoin: 'round'
    }).addTo(regionsLayer);

    // Обводка потолще
    L.polyline(closed, {
      color: color,
      weight: 5,
      opacity: 0.9,
      lineCap: 'round',
      lineJoin: 'round'
    }).addTo(regionsLayer);

    // Геометрия
    const geometry = {
      type: 'Polygon',
      coordinates: [closed.map(ll => [ll.lng, ll.lat])]
    };

    const y = window.__ensureYear(window.__currentYear());
    y.regions.push({ side, color, geometry });

    window.__saveState();
    window.__renderYear(window.__currentYear());

    lassoPoints = [];
    window.__setMode(null);
  });

  // ============================================================
  // КАРАНДАШ — свободная линия
  // ============================================================
  let pencilPoints = [];
  let pencilLine = null;
  let pencilDrawing = false;

  map.on('mousedown', e => {
    if (window.__currentMode() !== 'pencil') return;
    if (e.originalEvent && e.originalEvent.button !== 0) return;

    pencilDrawing = true;
    pencilPoints = [e.latlng];

    pencilLine = L.polyline(pencilPoints, {
      color: window.__pencilColor(),
      weight: window.__pencilThickness(),
      opacity: 1,
      lineCap: 'round',
      lineJoin: 'round'
    }).addTo(map);
  });

  map.on('mousemove', e => {
    if (!pencilDrawing) return;
    pencilPoints.push(e.latlng);
    pencilLine.setLatLngs(pencilPoints);

    if (e.originalEvent) {
      startAutoPan(e.originalEvent.clientX, e.originalEvent.clientY);
    }
  });

  map.on('mouseup', e => {
    if (!pencilDrawing) return;
    pencilDrawing = false;
    stopAutoPan();

    if (pencilLine) {
      map.removeLayer(pencilLine);
      pencilLine = null;
    }

    if (pencilPoints.length < 2) {
      pencilPoints = [];
      return;
    }

    const coords = pencilPoints.map(ll => [ll.lat, ll.lng]);
    const y = window.__ensureYear(window.__currentYear());
    y.lines.push({
      color: window.__pencilColor(),
      thickness: window.__pencilThickness(),
      coords
    });

    window.__saveState();
    window.__renderYear(window.__currentYear());

    pencilPoints = [];
    window.__setMode(null);
  });

  // ============================================================
  // ЛИНИЯ АТАКИ — 2 клика ЛКМ
  // ============================================================
  let attackStart = null;
  let attackTempLine = null;
  let attackTempArrow = null;

  map.on('click', e => {
    if (window.__currentMode() !== 'attack') return;

    if (!attackStart) {
      // Первый клик
      attackStart = e.latlng;

      attackTempLine = L.polyline([attackStart, attackStart], {
        color: window.__attackColor(),
        weight: window.__attackThickness(),
        dashArray: '10 6',
        opacity: 0.9
      }).addTo(map);
    } else {
      // Второй клик — финал
      const end = e.latlng;

      if (attackTempLine) {
        map.removeLayer(attackTempLine);
        attackTempLine = null;
      }

      const coords = [[attackStart.lat, attackStart.lng], [end.lat, end.lng]];
      const y = window.__ensureYear(window.__currentYear());
      y.attacks.push({
        color: window.__attackColor(),
        thickness: window.__attackThickness(),
        coords
      });

      window.__saveState();
      window.__renderYear(window.__currentYear());

      attackStart = null;
      window.__setMode(null);
    }
  });

  // Отмена атаки по ESC
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (attackTempLine) {
        map.removeLayer(attackTempLine);
        attackTempLine = null;
      }
      attackStart = null;
    }
  });

  // ============================================================
  // ЛИНИЯ ПРОДВИЖЕНИЯ — зажал ЛКМ → провёл → отпустил
  // ============================================================
  let advancePoints = [];
  let advanceLine = null;
  let advanceDrawing = false;

  map.on('mousedown', e => {
    if (window.__currentMode() !== 'advance') return;
    if (e.originalEvent && e.originalEvent.button !== 0) return;

    advanceDrawing = true;
    advancePoints = [e.latlng];

    advanceLine = L.polyline(advancePoints, {
      color: window.__COLORS[window.__activeSide()],
      weight: 5,
      opacity: 0.9,
      lineCap: 'round',
      lineJoin: 'round'
    }).addTo(map);
  });

  map.on('mousemove', e => {
    if (!advanceDrawing) return;
    advancePoints.push(e.latlng);
    advanceLine.setLatLngs(advancePoints);

    if (e.originalEvent) {
      startAutoPan(e.originalEvent.clientX, e.originalEvent.clientY);
    }
  });

  map.on('mouseup', e => {
    if (!advanceDrawing) return;
    advanceDrawing = false;
    stopAutoPan();

    if (advanceLine) {
      map.removeLayer(advanceLine);
      advanceLine = null;
    }

    if (advancePoints.length < 2) {
      advancePoints = [];
      return;
    }

    const side = window.__activeSide();
    const color = window.__COLORS[side];

    // Строим "толстую полосу" вокруг линии
    const leftSide = [];
    const rightSide = [];
    const thickness = 0.08; // ~8 км

    for (let i = 0; i < advancePoints.length; i++) {
      const p = advancePoints[i];
      const prev = advancePoints[i - 1] || p;
      const next = advancePoints[i + 1] || p;

      const dx = next.lng - prev.lng;
      const dy = next.lat - prev.lat;
      const len = Math.sqrt(dx * dx + dy * dy) || 1;

      const nx = -dy / len;
      const ny = dx / len;

      leftSide.push([p.lat + ny * thickness, p.lng + nx * thickness]);
      rightSide.unshift([p.lat - ny * thickness, p.lng - nx * thickness]);
    }

    const polygonCoords = [...leftSide, ...rightSide];
    polygonCoords.push(polygonCoords[0]);

    // Заливка
    L.polygon(polygonCoords, {
      color: color,
      weight: 2,
      fillColor: color,
      fillOpacity: 0.4,
      opacity: 0.9
    }).addTo(regionsLayer);

    // Обводка
    L.polyline(advancePoints, {
      color: color,
      weight: 6,
      opacity: 1,
      lineCap: 'round',
      lineJoin: 'round'
    }).addTo(regionsLayer);

    // Геометрия
    const geometry = {
      type: 'Polygon',
      coordinates: [polygonCoords.map(ll => [ll[1], ll[0]])]
    };

    const y = window.__ensureYear(window.__currentYear());
    y.regions.push({ side, color, geometry, isAdvance: true });

    window.__saveState();
    window.__renderYear(window.__currentYear());

    advancePoints = [];
    window.__setMode(null);
  });

  // ============================================================
  // ОБЩИЙ ФИКС: блокируем ПКМ при рисовании
  // ============================================================
  mapContainer.addEventListener('mousedown', e => {
    if (e.button === 2) e.stopPropagation();
  }, true);
</script>

</body>
<script>
  // ============================================================
  // ЧАСТЬ 5 — экспорт, импорт, финальные фиксы
  // ============================================================

  // ---------- ЭКСПОРТ В ФАЙЛ ----------
  document.getElementById('btnExport').addEventListener('click', () => {
    const data = {
      version: 5,
      exportedAt: new Date().toISOString(),
      sides: window.__sides,
      activeSide: window.__activeSide(),
      pencilColor: window.__pencilColor(),
      pencilThickness: window.__pencilThickness(),
      attackColor: window.__attackColor(),
      attackThickness: window.__attackThickness(),
      years: window.__yearsData
    };

    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'x3led-map-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
  });

  // ---------- ИМПОРТ ИЗ ФАЙЛА ----------
  document.getElementById('btnImport').addEventListener('click', () => {
    document.getElementById('importFile').click();
  });

  document.getElementById('importFile').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.years) throw new Error('Неверный формат файла');

        if (!confirm('Загрузить карту из файла? Текущие данные будут заменены.')) return;

        if (data.sides) {
          window.__sides.A.countries = data.sides.A?.countries || [];
          window.__sides.B.countries = data.sides.B?.countries || [];
          if (data.sides.A?.color) window.__sides.A.color = data.sides.A.color;
          if (data.sides.B?.color) window.__sides.B.color = data.sides.B.color;
        }

        window.__yearsData = data.years;
        window.__saveState();

        // Перезагружаем страницу чтобы всё применилось чисто
        location.reload();
      } catch (err) {
        alert('Ошибка загрузки: ' + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  // ---------- ФИКС: ПКМ не вызывает ничего ----------
  document.getElementById('map').addEventListener('mousedown', e => {
    if (e.button === 2) {
      e.stopPropagation();
      e.preventDefault();
    }
  }, true);

  // ---------- ФИКС: если ЛКМ отпущен вне окна — сбросить рисование ----------
  window.addEventListener('blur', () => {
    // эмулируем mouseup
    document.dispatchEvent(new MouseEvent('mouseup', { button: 0 }));
  });

  // ---------- ПОДСКАЗКА ПРИ ПЕРВОМ ЗАХОДЕ ----------
  if (!localStorage.getItem('x3led-map-welcome-v5')) {
    setTimeout(() => {
      alert(
        'Редактор карты:\n\n' +
        '• Стороны: добавляй страны через поиск, меняй цвет кликом по кружочку\n' +
        '• Аннексия: клик по стране\n' +
        '• Обводка: зажми ЛКМ → обведи → отпусти\n' +
        '• Карандаш: зажми ЛКМ → веди → свободная линия\n' +
        '• Линия атаки: 2 клика ЛКМ → стрелка\n' +
        '• Линия продвижения: зажми ЛКМ → проведи\n' +
        '• Отменить последнее — удаляет последнюю фигуру\n' +
        '• Удалить всё (этот год) — очищает год\n' +
        '• ПКМ — двигать карту\n' +
        '• ESC — отмена'
      );
      try { localStorage.setItem('x3led-map-welcome-v5', '1'); } catch (err) {}
    }, 1500);
  }

  // ---------- ЛОГ ----------
  console.log('%c[Карта готова — v5]', 'color:#8b6cff;font-size:16px;font-weight:bold');
  console.log('Стороны:', window.__sides.A.countries.length, '+', window.__sides.B.countries.length);
  console.log('Годы с данными:', Object.keys(window.__yearsData).length);
</script>
